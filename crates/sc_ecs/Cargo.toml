[package]
name = "sc_ecs"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"
description = "An no lock asynchronous ECS framework"
keywords = ["ECS", "Asynchronous", "Entity", "Component", "System"]

[dependencies]
sc_ecs_macros = { path = "sc_ecs_macros", version = "0.1.0" }
sc_error = { path = "../sc_error" }
sc_log = { path = "../sc_log" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
parking_lot.workspace = true
indexmap = "2.7.0"
ahash = "=0.8.12"
log = "=0.4.34"
anyhow = "=1.0.104"
lazy_static.workspace = true
flume = "=0.12.0"
sha2.workspace = true

[lints]
workspace = true
