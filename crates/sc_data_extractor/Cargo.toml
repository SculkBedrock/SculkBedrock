[package]
name = "sc_data_extractor"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"
description = "离线数据转换工具：把生态导出物（block_palette_*.nbt 等）转换为 SC 规范数据文件"

[dependencies]
flate2.workspace = true
serde_json.workspace = true
sc_binary = { path = "../sc_binary" }
sc_nbt = { path = "../sc_nbt" }
sc_packloader = { path = "../sc_packloader" }

[dev-dependencies]
sc_block = { path = "../sc_block" }
zip = "=8.6.0"

[lints]
workspace = true
