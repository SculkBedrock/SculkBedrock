[package]
name = "sc_console"
version = "0.1.0"
edition = "2021"
description = "SculkBedrock 独立命令行控制台（TUI 输入框 + 命令补全接口）"
license = "MIT"

[dependencies]
crossterm = "0.29"
unicode-width = "0.2"
log = "0.4"
chrono = "0.4"
libc = "0.2"
sysinfo = "0.39"
rust-i18n = "3"
rust-i18n-macro = "=3.0.0"

[dev-dependencies]
vt100 = "0.16"
